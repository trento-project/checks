id: "2A4BF0"
name: sustkover global.ini file configuration is properly done
group: Ini Files
description: |
  sustkover global.ini file configuration is properly done
remediation: |
  ## Abstract
  The sustkover python hook allows manual takeover of the HANA primary if the SAP HANA multi-state resource (managed by SAPHanaController) is set into maintenance or the Linux cluster is stopped. Otherwise the manual takeover is blocked.

  ## Remediation
  Edit the global.ini configuration and make changes as per the best practice guide

  ## References
  Azure:
    - https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability?tabs=lb-portal%2Csaphanasr#tabpanel_3_saphanasr

  AWS:
    - https://docs.aws.amazon.com/sap/latest/sap-hana/sap-hana-pacemaker-sles-hana-control.html#hook_sustkover

  GCP:
    - https://cloud.google.com/solutions/sap/docs/sap-hana-ha-config-sles#enable-hana-hadr-provider-hook

  SUSE / KVM:
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-sr-guide-PerfOpt-15/index.html#id-1.10.11.4

  Nutanix:
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-sr-guide-PerfOpt-15/index.html#id-1.10.11.4

severity: critical
metadata:
  target_type: cluster
  cluster_type:
    - hana_scale_up
  architecture_type:
    - classic
    - angi
  hana_scenario:
    - performance_optimized

facts:
  - name: ini_files
    gatherer: ini_files@v1
    argument: global.ini

values:
  - name: execution_order
    default: 2
  - name: path1
    default: "/usr/share/SAPHanaSR-angi/"
    conditions:
      - value: "/usr/share/SAPHanaSR/"
        when: env.architecture_type == "classic"
  - name: path2
    default: "/usr/share/SAPHanaSR-angi"
    conditions:
      - value: "/usr/share/SAPHanaSR"
        when: env.architecture_type == "classic"
  - name: provider
    customization_disabled: true
    default: "susTkOver"

expectations:
  - name: expectations_sustkover_global_ini_configured
    expect: |
      for items in facts.ini_files {
        let sustkover = items.content.ha_dr_provider_sustkover;
        if sustkover.execution_order == values.execution_order && (sustkover.path == values.path1 || sustkover.path == values.path2) && sustkover.provider == values.provider {return true;}
      }
      return false;
    failure_message: sustkover section in global.ini is not correctly configured
