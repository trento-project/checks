id: "205AF7"
name: fencing enabled
group: Pacemaker
description: |
  Fencing is enabled in the cluster properties 'cib-bootstrap-options': fencing-enabled (Pacemaker 3.0.2+) or stonith-enabled (Pacemaker < 3.0.2)
remediation: |
  ## Abstract
  Fencing is mandatory to guarantee data integrity for your SAP Applications.
  Running an HA cluster without fencing is not supported and might cause data loss.

  ## Remediation
  Execute the following command to enable it:
  ```
  crm configure property fencing-enabled=true
  ```
  On Pacemaker versions older than 3.0.2:
  ```
  crm configure property stonith-enabled=true
  ```

  ## References
  Azure:

    - https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker#create-a-fencing-device-on-the-pacemaker-cluster

  AWS:

    - https://docs.aws.amazon.com/sap/latest/sap-hana/sap-hana-on-aws-cluster-resources.html#sap-hana-on-aws-cluster-the-bootstrap

  GCP:

    - https://cloud.google.com/solutions/sap/docs/sap-hana-ha-config-sles#configure_the_general_cluster_properties

  Nutanix:

    - https://documentation.suse.com/sbp/all/single-html/SLES4SAP-hana-sr-guide-PerfOpt-15/#id-cluster-bootstrap-and-more
    - https://documentation.suse.com/sle-ha/15-SP5/single-html/SLE-HA-administration/#sec-ha-fencing-recommend

  SUSE / KVM:

    - https://documentation.suse.com/sbp/all/single-html/SLES4SAP-hana-sr-guide-PerfOpt-15/#id-cluster-bootstrap-and-more
    - https://documentation.suse.com/sle-ha/15-SP5/single-html/SLE-HA-administration/#sec-ha-fencing-recommend

  VMware:

    - https://documentation.suse.com/sbp/all/single-html/SLES4SAP-hana-sr-guide-PerfOpt-15/#id-cluster-bootstrap-and-more
    - https://documentation.suse.com/sle-ha/15-SP5/single-html/SLE-HA-administration/#sec-ha-fencing-recommend

metadata:
  target_type: cluster
  cluster_type:
    - hana_scale_up
    - ascs_ers
  hana_scenario:
    - performance_optimized
    - cost_optimized
facts:
  - name: crm_config_properties
    gatherer: cibadmin@v1
    argument: cib.configuration.crm_config.cluster_property_set
  - name: crm_feature_set
    gatherer: cibadmin@v1
    argument: cib.crm_feature_set

values:
  - name: expected_crm_feature_set_pacemaker_302
    default: "3.20.0"

expectations:
  - name: expectations_fencing_enabled
    expect_enum: |
      let bootstrap = facts.crm_config_properties.find(|item| item.id == "cib-bootstrap-options").nvpair;
      let fencing_enabled = bootstrap.find(|prop| prop.name == "fencing-enabled");
      let stonith_enabled = bootstrap.find(|prop| prop.name == "stonith-enabled");

      let fencing_enabled_ok = fencing_enabled != () && fencing_enabled.value == true;
      let stonith_enabled_ok = stonith_enabled != () && stonith_enabled.value == true;

      let feature_set = facts.crm_feature_set.split(".").map(|part| parse_int(part));
      let threshold = values.expected_crm_feature_set_pacemaker_302.split(".").map(|part| parse_int(part));
      let is_pacemaker_302_or_newer = feature_set[0] > threshold[0] || (feature_set[0] == threshold[0] && feature_set[1] >= threshold[1]);

      if is_pacemaker_302_or_newer {
        // fencing-enabled is the effective property here: if present, its value is authoritative
        if fencing_enabled != () {
          if fencing_enabled_ok { "passing" } else { "critical" }
        } else if stonith_enabled_ok {
          "warning"
        } else {
          "critical"
        }
      } else {
        // stonith-enabled is the effective property here; fencing-enabled is unrecognized
        if stonith_enabled_ok {
          if fencing_enabled != () { "warning" } else { "passing" }
        } else {
          "critical"
        }
      }
    warning_message: Fencing is enabled using a deprecated or unrecognized property for the detected Pacemaker version ('stonith-enabled' is deprecated on Pacemaker 3.0.2+, 'fencing-enabled' is not recognized before it). The cluster is functional but the configuration should be migrated to the property matching the running Pacemaker version.
    failure_message: Fencing was expected to be enabled in the cluster configuration, but neither 'fencing-enabled' nor 'stonith-enabled' is correctly set to true for the detected Pacemaker version.
