id: "9CFD28"
name: Virtual IP resource is configured
group: Pacemaker
description: |
  Virtual IP resource is configured
remediation: |
  ## Abstract
  Virtual IP resource is needed for applications to connect to HANA database. This virtual IP should always point to the Primary HANA Database Server and therefore this virtual IP is a floating IP.

  ## Remediation
  Edit the crm configuration and make changes as per the best practice guide

  ## References
  Azure:
    - https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability?tabs=lb-portal%2Csaphanasr#tabpanel_7_saphanasr

  AWS:
    - https://docs.aws.amazon.com/sap/latest/sap-hana/sap-hana-on-aws-move-the-ip-resource.html
      ## AWS has a different resource agent for virtual IP and different values for interval and timeout for monitor operation for virtual IP resource configured

  GCP:
    - https://cloud.google.com/solutions/sap/docs/sap-hana-ha-config-sles#sles-for-sap-15-sp5-or-earlier
      ## GCP has the same resource agent IPaddr2 but different values for interval and timeout for monitor operations.

  SUSE / KVM:
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-sr-guide-PerfOpt-15/index.html#id-adding-a-virtual-ip-address-for-the-primary-site
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-angi-scaleout-perfopt-15/index.html#id-virtual-ip-address-of-the-hana-primary
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-angi-perfopt-15/index.html#id-adding-a-virtual-ip-address-for-the-primary-site

  Nutanix:
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-sr-guide-PerfOpt-15/index.html#id-adding-a-virtual-ip-address-for-the-primary-site
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-angi-scaleout-perfopt-15/index.html#id-virtual-ip-address-of-the-hana-primary
    - https://documentation.suse.com/sbp/sap-15/html/SLES4SAP-hana-angi-perfopt-15/index.html#id-adding-a-virtual-ip-address-for-the-primary-site

customization_disabled: true
severity: critical
metadata:
  target_type: cluster
  cluster_type:
    - hana_scale_up
    - hana_scale_out
  architecture_type:
    - classic
    - angi
  hana_scenario:
    - performance_optimized
    - cost_optimized

facts:
  - name: resources
    gatherer: cibadmin@v1
    argument: cib.configuration.resources

values:
  - name: resource_provider
    default: "heartbeat"
    conditions:
      - value: "suse"
        when: env.provider == "aws"
  - name: resource_type
    default: "IPaddr2"
    conditions:
      - value: "aws-vpc-move-ip"
        when: env.provider == "aws"

expectations:
  - name: expectations_vip_configured
    expect: |
          let primitives = facts.resources.primitive;
          for prim in primitives {
                  let vip = prim.instance_attributes.nvpair.find(|item| item.name == "ip");
                  if vip != () && prim.provider == values.resource_provider && prim.type == values.resource_type { return true; }
            }
          let groups = facts.resources.group;
          for grp in groups {
          let primitives = grp.primitive;
          for prim in primitives {
                  let vip = prim.instance_attributes.nvpair.find(|item| item.name == "ip");
                  if vip != () && prim.provider == values.resource_provider && prim.type == values.resource_type { return true; }
            }
            }
          return false;
    failure_message: virtual IP resource is not correctly configured
