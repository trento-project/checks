id: "373DB8"
name: fencing timeout
group: Pacemaker
description: |
  Cluster fencing timeout is configured correctly in the cluster properties 'cib-bootstrap-options': fencing-timeout (Pacemaker 3.0.2+) or stonith-timeout (Pacemaker < 3.0.2)
remediation: |
  ## Abstract
  The fencing timeout (`fencing-timeout` in Pacemaker 3.0.2+, `stonith-timeout` in older versions) determines the time Pacemaker will wait for fencing to succeed.
  The recommended default value is at least `150` seconds for SBD.
  The recommended values on Azure are at least `144` seconds for SBD only or `900` seconds when using SBD combined with the Azure Fence agent.
  The recommended value on AWS is at least `600` seconds.
  The recommended value on GCP is at least `300` seconds.

  ## Remediation
  Execute the following command to adjust the timeout for your use case:
  ```crm configure property fencing-timeout=144```
  or
  ```crm configure property fencing-timeout=900```

  On Pacemaker versions older than 3.0.2:
  ```crm configure property stonith-timeout=144```
  or
  ```crm configure property stonith-timeout=900```

  ## References
  Azure:

    - https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker#create-a-fencing-device-on-the-pacemaker-cluster

  AWS:

    - https://docs.aws.amazon.com/sap/latest/sap-hana/sap-hana-on-aws-cluster-resources.html#sap-hana-on-aws-cluster-the-bootstrap

  GCP:

    - https://cloud.google.com/solutions/sap/docs/sap-hana-ha-config-sles#configure_the_general_cluster_properties

  Nutanix:

    - https://documentation.suse.com/sbp/all/single-html/SLES4SAP-hana-sr-guide-PerfOpt-15/#id-cluster-bootstrap-and-more

  SUSE / KVM:

    - https://documentation.suse.com/sbp/all/single-html/SLES4SAP-hana-sr-guide-PerfOpt-15/#id-cluster-bootstrap-and-more

  VMware:

    - https://documentation.suse.com/sbp/all/single-html/SLES4SAP-hana-sr-guide-PerfOpt-15/#id-cluster-bootstrap-and-more

metadata:
  target_type: cluster
  cluster_type:
    - hana_scale_up
    - ascs_ers
  hana_scenario:
    - performance_optimized
    - cost_optimized
facts:
  - name: crm_config_properties
    gatherer: cibadmin@v1
    argument: cib.configuration.crm_config.cluster_property_set
  - name: resources_primitives
    gatherer: cibadmin@v1
    argument: cib.configuration.resources.primitive
  - name: crm_feature_set
    gatherer: cibadmin@v1
    argument: cib.crm_feature_set

values:
  - name: expected_fencing_timeout
    default: 150
    conditions:
      - value: 600
        when: env.provider == "aws"
      - value: 300
        when: env.provider == "gcp"
      - value: 144
        when: env.provider == "azure"

  - name: expected_azure_arm_fencing_timeout
    default: 900

  - name: expected_crm_feature_set_pacemaker_302
    default: "3.20.0"

expectations:
  - name: expectations_fencing_timeout
    expect_enum: |
      let bootstrap_nvpairs = facts.crm_config_properties.find(|item| item.id == "cib-bootstrap-options").nvpair;
      let fencing_timeout = bootstrap_nvpairs.find(|prop| prop.name == "fencing-timeout");
      let stonith_timeout = bootstrap_nvpairs.find(|prop| prop.name == "stonith-timeout");

      let fence_azure_arm_detected = facts.resources_primitives.filter(|item| item.type == "fence_azure_arm").len() != 0;

      let expected_timeout = if fence_azure_arm_detected {
        values.expected_azure_arm_fencing_timeout
      } else {
        values.expected_fencing_timeout
      };

      let fencing_timeout_ok = fencing_timeout != () && fencing_timeout.value >= expected_timeout;
      let stonith_timeout_ok = stonith_timeout != () && stonith_timeout.value >= expected_timeout;

      let feature_set = facts.crm_feature_set.split(".").map(|part| parse_int(part));
      let threshold = values.expected_crm_feature_set_pacemaker_302.split(".").map(|part| parse_int(part));
      let is_pacemaker_302_or_newer = feature_set[0] > threshold[0] || (feature_set[0] == threshold[0] && feature_set[1] >= threshold[1]);

      if is_pacemaker_302_or_newer {
        // fencing-timeout is the effective property here: if present, its value is authoritative
        if fencing_timeout != () {
          if fencing_timeout_ok { "passing" } else { "critical" }
        } else if stonith_timeout_ok {
          "warning"
        } else {
          "critical"
        }
      } else {
        // stonith-timeout is the effective property here; fencing-timeout is unrecognized
        if stonith_timeout_ok {
          if fencing_timeout != () { "warning" } else { "passing" }
        } else {
          "critical"
        }
      }
    warning_message: Cluster fencing timeout is configured using a deprecated or unrecognized property for the detected Pacemaker version ('stonith-timeout' is deprecated on Pacemaker 3.0.2+, 'fencing-timeout' is not recognized before it). The cluster is functional but the configuration should be migrated to the property matching the running Pacemaker version.
    failure_message: Cluster fencing timeout ('fencing-timeout' in Pacemaker 3.0.2+, 'stonith-timeout' in older versions) is not configured correctly for the detected Pacemaker version
